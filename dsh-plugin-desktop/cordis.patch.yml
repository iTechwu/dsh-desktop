# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: dofe-yootun-ui
      name: '@dofe/dsh-yootun-ui'
    - id: dofe-yootun-dashboard
      name: '@dofe/dsh-yootun-dashboard'
      config:
        registerHostRoute: false
    - id: dofe-yootun-recruiter
      name: '@dofe/dsh-yootun-recruiter'
      config:
        registerHostRoute: false
    - id: dofe-yootun-sales
      name: '@dofe/dsh-yootun-sales'
      config:
        registerHostRoute: false
    - id: dofe-yootun-supply-watch
      name: '@dofe/dsh-yootun-supply-watch'
      config:
        registerHostRoute: false
    - id: dofe-yootun-content-command
      name: '@dofe/dsh-yootun-content-command'
      config:
        registerHostRoute: false
    - id: dofe-yootun-knowledge
      name: '@dofe/dsh-yootun-knowledge'
    - id: dofe-yootun-approvals
      name: '@dofe/dsh-yootun-approvals'
      config:
        registerHostRoute: false
    - id: dofe-yootun-finops
      name: '@dofe/dsh-yootun-finops'
      config:
        registerHostRoute: false
    - id: dofe-yootun-retrofit
      name: '@dofe/dsh-yootun-retrofit'
    - id: dofe-yootun-daily-report
      name: '@dofe/dsh-yootun-daily-report'
    - id: dofe-yootun-lead-discovery
      name: '@dofe/dsh-yootun-lead-discovery'
    # Yootun 通用媒体上传能力（纯宿主插件，无客户端半）。AK/SK 不写进本文件，
    # 由部署侧 credential store（STORAGE_ACCESS_KEY_ID/SECRET）注入，装完即用。
    # entry id 与插件自带 dsh.bundle.patch 一致，避免合并出重复加载项。
    - id: dofe-yootun-tos-upload
      name: '@dofe/dsh-yootun-tos-upload'
      config:
        backend: tos
        tos:
          region: cn-beijing
          bucket: dofe-transcode
          keyPrefix: yootun/uploads
        limits:
          # 单文件大小上限（字节），默认 500MB。
          maxBytes: 524288000
        tool:
          # agent 工具单次上传超时（大视频走整段 await）。
          timeoutMs: 1800000
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: desktop-browser-tools
      name: dsh-plugin-desktop/browser-tools
    - id: desktop-ci-tools
      name: dsh-plugin-desktop/ci-tools
    - id: desktop-yootun-recruiter-tools
      name: dsh-plugin-desktop/yootun-recruiter-tools
    - id: dofe-managed
      name: dsh-plugin-desktop/dofe-managed
    - id: dofe-opencli
      name: dsh-plugin-desktop/dofe-opencli

# DoFe owns the model route in the Desktop distribution. The upstream adapter
# remains in place, but Desktop fixes its single managed key and endpoint.
- id: llm-deepseek
  config:
    apiKeyEnv: MODELS_API_KEY
    baseURL: https://ixicai.cn/api/v1
    connectionPolicy: composition
    models:
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        description: DoFe managed DeepSeek model
        contextWindow: 1000000
        inputModalities: [text, image]

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# The DoFe Access page is the only model configuration surface in Desktop.
# Users can still manage the key, but cannot select another provider, endpoint,
# or catalog through the upstream Models editor.
- id: ui-settings-models
  disabled: true

# Desktop supplies the Yootun occupants for the shared browser-brand slots.
- id: ui-brand-official
  disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
