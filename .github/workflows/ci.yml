name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  # Full product gate: build, typecheck, unit tests, and every headless smoke.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.product == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        if: needs.changes.outputs.product == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../deepseek-harness"
          curl --fail --location --retry 3 https://github.com/iTechwu/deepseek-harness/archive/refs/heads/dev.tar.gz | tar -xz --strip-components=1 -C "$GITHUB_WORKSPACE/../deepseek-harness"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          pnpm dofe-ui:build
      - name: Resolve pnpm store path
        if: needs.changes.outputs.product == 'true'
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The sibling fork keeps its own frozen lockfile; pnpm cannot freeze an
      # external symlink workspace against the Desktop-only root lockfile.
      - if: needs.changes.outputs.product == 'true'
        run: pnpm install --no-frozen-lockfile
      - if: needs.changes.outputs.product == 'true'
        run: pnpm upstream:install
      - if: needs.changes.outputs.product == 'true'
        run: pnpm upstream:build
      - if: needs.changes.outputs.product == 'true'
        run: pnpm check

  # Windows-only logic and unsigned NSIS/portable builds on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../deepseek-harness"
          curl --fail --location --retry 3 https://github.com/iTechwu/deepseek-harness/archive/refs/heads/dev.tar.gz | tar -xz --strip-components=1 -C "$GITHUB_WORKSPACE/../deepseek-harness"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          pnpm dofe-ui:build
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The following upstream install validates the sibling's own lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm upstream:install
      - run: pnpm upstream:build
      - run: pnpm --filter dsh-plugin-desktop check:win-package
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: pnpm --filter dsh-plugin-desktop dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: pnpm --filter dsh-plugin-desktop dist:win-portable
      - name: Upload Windows applications
        uses: actions/upload-artifact@v7
        with:
          name: yootun-agent-windows-x64
          path: |
            dsh-plugin-desktop/dist/Yootun-Agent-*-Setup.exe
            dsh-plugin-desktop/dist/Yootun-Agent-*-Portable.zip
          if-no-files-found: error
          retention-days: 7

  # macOS-only universal packaging smoke on a real macOS runner: the signed
  # release is built manually on a credentialed machine, so an unsigned DMG
  # here catches Intel and Apple Silicon packaging regressions before a manual
  # release. No signing secrets ever reach this job.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../deepseek-harness"
          curl --fail --location --retry 3 https://github.com/iTechwu/deepseek-harness/archive/refs/heads/dev.tar.gz | tar -xz --strip-components=1 -C "$GITHUB_WORKSPACE/../deepseek-harness"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          pnpm dofe-ui:build
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The following upstream install validates the sibling's own lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm upstream:install
      - run: pnpm upstream:build
      - run: pnpm --filter dsh-plugin-desktop check:mac-package
      - name: Build macOS smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: pnpm --filter dsh-plugin-desktop dist:mac-smoke
      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: yootun-agent-macos-universal
          path: dsh-plugin-desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error
          retention-days: 7

  # Sibling link smoke: the Windows junction materialization plus the
  # portable-shell scripts that must resolve the sibling checkout's own
  # pnpm release. Cheap by design: no workspace install.
  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../deepseek-harness"
          curl --fail --location --retry 3 https://github.com/iTechwu/deepseek-harness/archive/refs/heads/dev.tar.gz | tar -xz --strip-components=1 -C "$GITHUB_WORKSPACE/../deepseek-harness"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          pnpm dofe-ui:build
      - name: Probe the materialized workspace link
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('node:fs').realpathSync('deepseek-harness'); if(!p.endsWith('deepseek-harness')) process.exit(1); console.log('link ->', p)"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check:layout
      - run: pnpm upstream:version
