# Register the yootun-agent Knowledge capture host into the DSH bundle.
# Wires createYootunAgentAdapter() (from @repo/capture-sdk, vendored via file:)
# as a Cordis apply module that emits the six lifecycle events and flushes
# the bounded spool on shutdown.
- insert:
    - id: yootun-agent-knowledge-capture
      name: '@dofe/dsh-knowledge-capture'
