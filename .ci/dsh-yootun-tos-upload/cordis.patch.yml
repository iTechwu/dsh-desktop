# Yootun TOS 上传能力插件（纯宿主半，无客户端半）。
# 凭证卫生：本插件不持有 TOS AK/SK、桶、地域、endpoint——上传授权一律由
# Tools 服务的 tos_upload_authorize 工具下发（PUT 预签名 URL），凭证与内部
# 拓扑永不出服务端。这里只保留非敏感运行参数。
- insert:
    - id: dofe-yootun-tos-upload
      name: '@dofe/dsh-yootun-tos-upload'
      config:
        limits:
          # 单文件大小上限（字节），默认 500MB。
          maxBytes: 524288000
        tool:
          # agent 工具单次上传超时（大视频走整段 await）。
          timeoutMs: 1800000
