- insert:
    # GEORank MCP 客户端：把 GEORank 后端 /mcp 的 tools 以 mcp__georank__* 暴露给 Agent。
    # The public gateway validates MODELS_API_KEY and forwards tenant identity.
    - id: mcp-georank
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: georank
        url: 'https://ixicai.cn/mcp/georank'
        headers:
          Authorization: !!js ('Bearer ' + (process.env.MODELS_API_KEY || ''))
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true

    # Agent 使用 GEORank MCP 的操作 guidance（见 index.js）。
    - id: georank-geo-guidance
      name: '@dofe/dsh-georank-mcp'
